<main id="main"><section class="welcome"><h1>Private tasting archive</h1><p>개인 시음 기록을 안전하게 보관합니다.</p><div id="setup"><label>비밀번호 (최소 8자)<input id="pw" type="password" autocomplete="new-password" minlength="8"></label><label>비밀번호 확인<input id="pw2" type="password" autocomplete="new-password"></label><button id="start" class="primary">시작하기</button></div><div id="unlock" hidden><label>비밀번호<input id="loginpw" type="password" autocomplete="current-password"></label><button id="login" class="primary">잠금 해제</button></div><p id="status" role="status"></p><small>비밀번호는 서버에 저장되지 않습니다. 잊으면 복구할 수 없습니다.</small></section></main></div><script src="app.js"></script></body></html>
